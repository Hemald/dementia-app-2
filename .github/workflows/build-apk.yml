name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 # Recommended for AGP 9.0+ and SDK 36
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Updated to SDK 36 to match your project's targetSdk
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create dummy .env file
        # The Secrets Gradle Plugin in your build.gradle requires this file to exist
        run: echo "GEMINI_API_KEY=dummy_key" > .env

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        # Using --no-daemon is better for CI environments
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
